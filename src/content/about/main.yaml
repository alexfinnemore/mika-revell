heroImageAlt: Mika Revell portrait
bio: >-
  Mika Revell (b. 1985, Sydney, Australia) is a Chinese-American multimedia artist. Her work sets symbols of power against objects of desire, contrasting the ominous and the alluring. Using pink pigments and polished finishes, she looks at how things are manufactured, who labors to make them, and how the global supply chain moves resources and human lives. Her sculptures, paintings, and installations ask how weapons and commodities shape what we want.


  Revell received her MA in Fine Art from Central Saint Martins, London, and has held residencies in Riyadh, Tokyo, and Los Angeles. Using her signature pink as a panacea, she employs satire and absurdity to expose the ways we package and accept a brutal and competitive world.
