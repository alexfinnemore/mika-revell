title: "Love Threats"
year: 2018
description: >-
  Revell proposes a paradox: a war of love. To turn the tide of manipulative media, self-surveillance, and the pressure to conform, the micro-activism of guerrilla propaganda must become a tidal wave of tolerance, an empathetic revolution.

  This series highlights the hypernormalized state of unrest that has become a condition of contemporary life. Generations born into a global climate of conflict, extraction, and extinction have been denied the simple romantic ideas of potential, hope, and distant futures.

  The series responds to a shift within postmodernity, from a rejection of art historical traditions to an all-out assault on colonialism and white narratives of Otherness. Jacques Lacan described "the Big Other" as the invisible order that we act as if someone is watching over: a pervasive myth that maintains the status quo, divides power, and destroys intellectual agency. Revell's work pushes the viewer to question their beliefs about the hidden Big Other in their ideology.
