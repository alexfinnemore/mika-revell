title: "Unnatural Disasters"
subtitle: "Los Angeles, USA"
year: 2017
description: >
  Mushroom clouds in cyan, pink, and green, an oil spill, the oil fields of Kuwait, and Fukushima: each painting in this series depicts a man-made disaster as it appeared in international news and on social media. Mika paints them in oil, in hyper-saturated pinks and purples, a rose-colored lens through which these horrific events are distorted.

  From Hiroshima to the oil fields of Kuwait, each painting is a document of
  man's folly and Nature's fury. This series presents the viewer with a stark
  reality of the arrogance in the Anthropocene.
